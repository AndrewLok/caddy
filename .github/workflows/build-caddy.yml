# Save as .github/workflows/build-caddy.yml
#
# Checks daily for a new Caddy release. When one is found (and the official
# builder image for it has been published), builds Caddy with the modules in
# the Containerfile, verifies the modules are present, pushes to GHCR, and
# signs the image with cosign. Unsigned (failed) builds will be rejected by
# the server's signature policy.
#
# Required repository secrets:
#   COSIGN_PRIVATE_KEY  - contents of cosign.key
#   COSIGN_PASSWORD     - password for cosign.key

name: build-caddy

on:
  schedule:
    - cron: "23 5 * * *" # daily
  workflow_dispatch: # manual run always rebuilds
  push:
    branches: [main]
    paths:
      - Containerfile
      - .github/workflows/build-caddy.yml

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: caddy
  # "minor": build only when a new minor version appears (2.10 -> 2.11)
  # "patch": build on every release (2.10.1 -> 2.10.2) - recommended,
  #          since patch releases often contain security fixes
  BUILD_ON: patch
  # How many older releases to try when the newest has no builder image yet
  MAX_FALLBACK: 1

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      image: ${{ steps.check.outputs.image }}
      version: ${{ steps.check.outputs.version }}
      minor: ${{ steps.check.outputs.minor }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name != 'schedule' }}
        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY_OWNER,,}"   # GHCR needs lowercase
          image="ghcr.io/${owner}/${IMAGE_NAME}"

          # Stable Caddy releases, newest version first. Sorted by version
          # rather than date, so a backported patch to an older minor
          # version can't jump the queue.
          versions=$(gh api "repos/caddyserver/caddy/releases?per_page=30" \
            --jq '.[] | select(.draft | not) | select(.prerelease | not) | .tag_name' \
            | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V -r)
          newest=$(echo "$versions" | head -n1)

          # The Docker Hub builder image can lag behind the GitHub release.
          # Use the newest release that has one, looking back at most
          # MAX_FALLBACK releases so a missing tag can't cause a downgrade.
          version=""
          for v in $(echo "$versions" | head -n "$((MAX_FALLBACK + 1))"); do
            if skopeo inspect --raw "docker://docker.io/library/caddy:${v}-builder-alpine" >/dev/null 2>&1 \
               && skopeo inspect --raw "docker://docker.io/library/caddy:${v}-alpine" >/dev/null 2>&1; then
              version="$v"
              break
            fi
            echo "caddy:${v}-builder-alpine or caddy:${v}-alpine not published yet."
          done

          if [ -z "$version" ]; then
            echo "No builder image found for recent releases; will retry next run."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$version" != "$newest" ]; then
            echo "Using ${version} for now; ${newest} will be built once its builder image is published."
          fi

          minor="${version%.*}"     # e.g. 2.11
          {
            echo "image=${image}"
            echo "version=${version}"
            echo "minor=${minor}"
          } >> "$GITHUB_OUTPUT"

          if [ "$FORCE" = "true" ]; then
            echo "Manual or config-change run: building ${version}."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$BUILD_ON" = "minor" ]; then
            check_tag="$minor"
          else
            check_tag="$version"
          fi

          if skopeo inspect --raw --creds "${GITHUB_ACTOR}:${GH_TOKEN}" \
               "docker://${image}:${check_tag}" >/dev/null 2>&1; then
            echo "${image}:${check_tag} already exists; nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New release ${version}; building."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ needs.check.outputs.image }}
      VERSION: ${{ needs.check.outputs.version }}
      MINOR: ${{ needs.check.outputs.minor }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          # Without these, buildx wraps the image in a manifest list with
          # attestation entries, which podman's signature check trips over.
          provenance: false
          sbom: false
          build-args: |
            CADDY_VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:${{ env.MINOR }}
            ${{ env.IMAGE }}:latest

      - name: Verify modules are present
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          modules=$(docker run --rm "${IMAGE}@${DIGEST}" caddy list-modules)
          echo "$modules" | grep -qx 'dns.providers.cloudflare'
          echo "$modules" | grep -qx 'dns.providers.powerdns'
          echo "Both DNS provider modules found."

      - uses: sigstore/cosign-installer@v3

      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        # --recursive also signs each platform image if the digest is a manifest list.
        run: cosign sign --yes --recursive --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${DIGEST}"
